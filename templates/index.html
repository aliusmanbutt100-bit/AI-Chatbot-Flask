<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .chat-container {
            background: white;
            width: 450px;
            height: 600px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
            color: white;
            text-align: center;
        }
        
        .chat-header h2 { font-size: 20px; }
        .chat-header p { font-size: 12px; opacity: 0.8; margin-top: 4px; }
        
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }
        
        .message {
            margin: 10px 0;
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }
        
        .user-msg {
            justify-content: flex-end;
        }
        
        .bot-msg {
            justify-content: flex-start;
        }
        
        .bubble {
            max-width: 300px;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .user-msg .bubble {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .bot-msg .bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        
        .bot-avatar { background: #667eea; }
        
        .typing {
            display: none;
            padding: 12px 16px;
            background: white;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: fit-content;
        }
        
        .typing span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.2s infinite;
        }
        
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }
        
        .chat-input {
            padding: 16px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        
        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #eee;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
            transition: border 0.3s;
        }
        
        .chat-input input:focus {
            border-color: #667eea;
        }
        
        .chat-input button {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .chat-input button:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>🤖 AI Assistant</h2>
            <p>Always here to help!</p>
        </div>
        
        <div class="chat-box" id="chat-box">
            <div class="message bot-msg">
                <div class="avatar bot-avatar">🤖</div>
                <div class="bubble">Hi, Ali Usman created me and u can ask anything from me</div>
            </div>
        </div>
        
        <div class="message bot-msg" style="padding: 0 20px;">
            <div class="avatar bot-avatar">🤖</div>
            <div class="typing" id="typing">
                <span></span><span></span><span></span>
            </div>
        </div>
        
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Message likho..."/>
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            let input = document.getElementById("user-input");
            let message = input.value.trim();
            if (!message) return;

            let chatBox = document.getElementById("chat-box");
            
            // User message
            chatBox.innerHTML += `
                <div class="message user-msg">
                    <div class="bubble">${message}</div>
                </div>`;
            
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;
            
            // Typing indicator
            document.getElementById("typing").style.display = "block";

            // Flask ko bhejo
            let response = await fetch("/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message: message})
            });

            let data = await response.json();
            
            // Typing band karo
            document.getElementById("typing").style.display = "none";
            
            // Bot reply
            chatBox.innerHTML += `
                <div class="message bot-msg">
                    <div class="avatar bot-avatar">🤖</div>
                    <div class="bubble">${data.response}</div>
                </div>`;
            
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById("user-input").addEventListener("keypress", function(e) {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
